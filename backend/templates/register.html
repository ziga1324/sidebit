<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Register - ZestQuest</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#0a0a0f;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  background:#111118;
  padding:30px;
  border-radius:16px;
  width:300px;
}

input {
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#1a1a24;
  color:white;
}

button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#50f0c8;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>Register</h2>

  <input id="user" placeholder="username">
  <input id="pass" type="password" placeholder="password">

  <button onclick="register()">Ustvari račun</button>

  <p style="margin-top:10px;">
    Imaš račun? <a href="/login" style="color:#c8f050;">Login</a>
  </p>
</div>

<script>
function register() {
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if (!u || !p) return alert("Izpolni vsa polja");

  let users = JSON.parse(localStorage.getItem("users") || "[]");

  if (users.find(x => x.user === u)) {
    alert("User že obstaja");
    return;
  }

  users.push({ user: u, pass: p });
  localStorage.setItem("users", JSON.stringify(users));

  alert("Ustvarjeno!");
  window.location.href = "/login";
}
</script>

</body>
</html>
