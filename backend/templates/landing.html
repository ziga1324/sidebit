<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>ZestQuest</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#0a0a0f;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
}

.card {
  max-width:600px;
}

h1 {
  font-size:48px;
  margin-bottom:10px;
}

p {
  color:#aaa;
  margin-bottom:30px;
}

button {
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.primary { background:#c8f050; color:#000; }
.secondary { background:#1a1a24; color:#fff; border:1px solid #333; }

button:hover { transform:translateY(-2px); }
</style>
</head>

<body>

<div class="card">
  <h1>ZestQuest</h1>
  <p>AI app, ki ti vsak dan da mini “side quest” in te spravi iz rutine.</p>

  <button class="primary" onclick="location.href='/login'">Login</button>
  <button class="secondary" onclick="location.href='/register'">Register</button>
</div>

</body>
</html>
